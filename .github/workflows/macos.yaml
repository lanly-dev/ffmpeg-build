name: Reusable macOS Build

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          brew update
          brew install yasm nasm x264 x265 libvpx opus libvorbis pkg-config cmake

      - name: Download Pre-built Whisper
        uses: actions/download-artifact@v7
        with:
          name: whisper-macos-latest
          path: ${{ github.workspace }}/whisper_dl

      - name: Extract and configure Whisper
        run: |
          tar xzf "${{ github.workspace }}/whisper_dl/whisper_install-darwin-universal.tar.gz" \
            -C "${{ github.workspace }}"
          WHISPER_DIR="${{ github.workspace }}/whisper_target"

          # Rewrite pkg-config prefix to the absolute extraction path.
          # The whisper-build .pc uses ${pcfiledir}/../.. which not all pkg-config
          # versions resolve correctly; pin to the concrete path instead.
          PC_FILE="$WHISPER_DIR/lib/pkgconfig/whisper.pc"
          if [ ! -f "$PC_FILE" ]; then
            echo "ERROR: whisper.pc not found at $PC_FILE" >&2
            find "$WHISPER_DIR" -name "*.pc" >&2 || true
            exit 1
          fi
          sed -i '' "s|^prefix=.*|prefix=$WHISPER_DIR|" "$PC_FILE"
          echo "=== whisper.pc after rewrite ===" && cat "$PC_FILE"

          # Sanity-check pkg-config can resolve it
          PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig" pkg-config --modversion whisper
          PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig" pkg-config --cflags --libs whisper

          echo "WHISPER_DIR=$WHISPER_DIR" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: |
          set -euxo pipefail
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout "${{ inputs.ffmpeg_ref }}"
          export PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"
          ./configure \
            --prefix="$PWD/install" \
            --disable-debug \
            --disable-doc \
            --enable-gpl \
            --enable-version3 \
            --enable-static \
            --disable-shared \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libvorbis \
            --enable-videotoolbox \
            --enable-whisper \
            --extra-cflags="-I$WHISPER_DIR/include" \
            --extra-ldflags="-L$WHISPER_DIR/lib"
          make -j"$(sysctl -n hw.logicalcpu)"
          make install
          mkdir -p package
          cp -v install/bin/ffmpeg install/bin/ffprobe package/

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos-config-log
          path: FFmpeg/ffbuild/config.log

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos
          path: FFmpeg/package/