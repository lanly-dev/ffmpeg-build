name: Reusable macOS Build

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        required: true
        type: string
      ffmpeg_tag:
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew update && brew install yasm nasm x264 x265 libvpx opus libvorbis pkg-config cmake

      - name: Build whisper.cpp
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git
          cd whisper.cpp && cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j"$(sysctl -n hw.logicalcpu)" && sudo cmake --install build

      - name: Build FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg && git checkout "${{ inputs.ffmpeg_ref }}"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./configure --prefix="$PWD/install" --disable-debug --disable-doc --enable-gpl --enable-version3 --enable-static --disable-shared --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-whisper --enable-videotoolbox
          make -j"$(sysctl -n hw.logicalcpu)" && make install
          mkdir -p package && cp -v install/bin/ffmpeg install/bin/ffprobe package/

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: FFmpeg/package/