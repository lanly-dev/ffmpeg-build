name: Reusable Linux Build

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm git pkg-config curl zip cmake \
            libx264-dev libx265-dev libvpx-dev libopus-dev libvorbis-dev libva-dev

      - name: Install nv-codec-headers
        run: |
          git clone https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers
          sudo make install PREFIX=/usr/local

      - name: Download Pre-built Whisper
        uses: actions/download-artifact@v7
        with:
          name: whisper-linux-latest
          path: ${{ github.workspace }}/whisper_dl

      - name: Extract and configure Whisper
        run: |
          tar xzf "${{ github.workspace }}/whisper_dl/whisper_install-linux-x86_64.tar.gz" \
            -C "${{ github.workspace }}"
          WHISPER_DIR="${{ github.workspace }}/whisper_target"

          # Rewrite pkg-config prefix to the absolute extraction path.
          # The whisper-build .pc uses ${pcfiledir}/../.. which not all pkg-config
          # versions resolve correctly; pin to the concrete path instead.
          PC_FILE="$WHISPER_DIR/lib/pkgconfig/whisper.pc"
          if [ ! -f "$PC_FILE" ]; then
            echo "ERROR: whisper.pc not found at $PC_FILE" >&2
            find "$WHISPER_DIR" -name "*.pc" >&2 || true
            exit 1
          fi
          sed -i "s|^prefix=.*|prefix=$WHISPER_DIR|" "$PC_FILE"
          echo "=== whisper.pc after rewrite ===" && cat "$PC_FILE"

          # Sanity-check pkg-config can resolve it
          WHISPER_VER=$(PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig" pkg-config --modversion whisper 2>&1)
          echo "whisper version from pkg-config: $WHISPER_VER"
          PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig" pkg-config --cflags --libs whisper

          # Show full whisper.pc for debugging
          echo "=== whisper.pc ===" && cat "$WHISPER_DIR/lib/pkgconfig/whisper.pc"

          # Check minimum version (1.7.5 = 1,7,5)
          IFS='.' read -r MAJ MIN PAT <<< "$WHISPER_VER"
          if [ "$MAJ" -lt 1 ] || ([ "$MAJ" -eq 1 ] && [ "$MIN" -lt 7 ]) || ([ "$MAJ" -eq 1 ] && [ "$MIN" -eq 7 ] && [ "$PAT" -lt 5 ]); then
            echo "ERROR: whisper version $WHISPER_VER is below required 1.7.5" >&2
            exit 1
          fi
          echo "whisper version $WHISPER_VER meets minimum requirement"

          echo "WHISPER_DIR=$WHISPER_DIR" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: |
          set -euxo pipefail
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout "${{ inputs.ffmpeg_ref }}"
          export PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig:/usr/local/lib/pkgconfig"
          ./configure \
            --prefix="$PWD/install" \
            --disable-debug \
            --disable-doc \
            --enable-gpl \
            --enable-version3 \
            --enable-static \
            --disable-shared \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libvorbis \
            --enable-vaapi \
            --enable-ffnvcodec \
            --enable-nvenc \
            --enable-nvdec \
            --enable-whisper \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$WHISPER_DIR/include" \
            --extra-ldflags="-L$WHISPER_DIR/lib"
          make -j"$(nproc)" 2>&1 | tee /tmp/make.log; test ${PIPESTATUS[0]} -eq 0
          make install
          mkdir -p package
          cp -v install/bin/ffmpeg install/bin/ffprobe package/

      - name: Show make errors on failure
        if: failure()
        run: |
          echo "=== Last 100 lines of make output ==="
          tail -100 /tmp/make.log || true
          echo "=== Installed whisper libs ==="
          ls -lh "$WHISPER_DIR/lib/" || true
          echo "=== whisper.pc ==="
          cat "$WHISPER_DIR/lib/pkgconfig/whisper.pc" || true
          echo "=== pkg-config static output ==="
          PKG_CONFIG_PATH="$WHISPER_DIR/lib/pkgconfig" pkg-config --static --libs whisper || true

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-linux
          path: FFmpeg/package/