name: Reusable Linux Build

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm git pkg-config curl zip cmake \
            libx264-dev libx265-dev libvpx-dev libopus-dev libvorbis-dev libva-dev

      - name: Download Pre-built Whisper
        uses: actions/download-artifact@v4
        with:
          name: whisper-linux-latest
          path: ${{ github.workspace }}/whisper

      - name: Extract Whisper
        run: tar xzf "${{ github.workspace }}/whisper/whisper_install-linux-x86_64.tar.gz" -C "${{ github.workspace }}"

      - name: Fix Whisper pkg-config paths
        run: |
          WHISPER_DIR="${{ github.workspace }}/whisper_target"
          for pc in "$WHISPER_DIR/lib/pkgconfig"/*.pc; do
            sed -i \
              -e "s|^prefix=.*|prefix=$WHISPER_DIR|" \
              -e 's|^libdir=.*|libdir=${prefix}/lib|' \
              -e 's|^includedir=.*|includedir=${prefix}/include|' \
              "$pc"
          done

      - name: Build FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg && git checkout "${{ inputs.ffmpeg_ref }}"
          export PKG_CONFIG_PATH="${{ github.workspace }}/whisper_target/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./configure --prefix="$PWD/install" --disable-debug --disable-doc --enable-gpl --enable-version3 --enable-static --disable-shared --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-whisper --enable-vaapi --enable-ffnvcodec --enable-nvenc --enable-nvdec
          make -j"$(nproc)" && make install
          mkdir -p package && cp -v install/bin/ffmpeg install/bin/ffprobe package/

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: FFmpeg/package/