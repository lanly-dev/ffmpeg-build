name: Build FFmpeg (Monthly) and Release

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: 'FFmpeg ref (tag, branch, or commit SHA).'
        required: false

permissions:
  contents: write

jobs:
  resolve_ref:
    name: Resolve FFmpeg ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Compute date stamp
        id: date
        run: echo "date=$(date -u +'%Y%m')" >> "$GITHUB_OUTPUT"

      - name: Resolve ref
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ffmpeg_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            [[ "$INPUT_REF" =~ ^n[0-9] ]] && echo "tag=$INPUT_REF" >> "$GITHUB_OUTPUT" || echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(curl -fsSL "https://api.github.com/repos/FFmpeg/FFmpeg/tags?per_page=100" | jq -r '.[].name' | grep -E '^n[0-9]+(\.[0-9]+)*$' | sort -Vr | head -n1)
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # --- Step 2: Download whisper from whisper-build releases ---
  download-whisper:
    name: Download Whisper Dependencies
    needs: resolve_ref
    uses: ./.github/workflows/whisper.yaml
    with:
      tag_name: ${{ needs.resolve_ref.outputs.ref }}

  # --- Step 3: Call the 3 separate build files (now waiting on Whisper) ---
  build-linux:
    needs: [resolve_ref, download-whisper]
    uses: ./.github/workflows/linux.yaml
    with:
      ffmpeg_ref: ${{ needs.resolve_ref.outputs.ref }}

  build-macos:
    needs: [resolve_ref, download-whisper]
    uses: ./.github/workflows/macos.yaml
    with:
      ffmpeg_ref: ${{ needs.resolve_ref.outputs.ref }}

  build-windows:
    needs: [resolve_ref, download-whisper]
    uses: ./.github/workflows/windows.yaml
    with:
      ffmpeg_ref: ${{ needs.resolve_ref.outputs.ref }}

  # --- Triggers ONLY when all three finishes successfully ---
  release:
    name: Publish Release
    needs: [resolve_ref, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: all-ffmpeg-artifacts
          pattern: ffmpeg-*

      - name: Consolidate release files
        run: |
          mkdir -p release
          for artifact in ffmpeg-linux ffmpeg-macos ffmpeg-windows whisper-linux-latest whisper-macos-latest whisper-windows-latest; do
            if ls "${artifact}"*; then
              # Extract tarballs for artifacts that are archives
              case "$artifact" in
                whisper-*)
                  mkdir -p "release/$(echo $artifact | sed 's/ffmpeg/whisper/')"
                  cd "release/$(echo $artifact | sed 's/ffmpeg/whisper/')"
                  tar xzf ../${artifact} 2>/dev/null || true
                  cd ../../
                  ;;
                ffmpeg-linux)
                  cp -rv "${artifact}/"* release/ 2>/dev/null || true
                  ;;
                *)
                  mkdir -p "release/$artifact"
                  cp -rv "${artifact}/"* "release/$artifact/" 2>/dev/null || true
                  ;;
              esac
            fi
          done

      - name: Create or Update Release (Latest FFmpeg)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ needs.resolve_ref.outputs.date }}"
          TAG="ffmpeg-n${DATE}"
          # Fallback to a unique date-based tag if no n-tag exists
          if [ -z "${{ needs.resolve_ref.outputs.tag }}" ]; then
            TAG="ffmpeg-latest-${{ needs.resolve_ref.outputs.date }}"
          fi
          BODY="Automated build from $(date -u +'%Y-%m-%d') using FFmpeg ref \`${{ needs.resolve_ref.outputs.ref }}\` with whisper support."
          gh release create "$TAG" --title "FFmpeg ${{ needs.resolve_ref.outputs.ref }}" --notes "$BODY" release/ || true