name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git zip nasm yasm mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-x264 mingw-w64-x86_64-x265 mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-opus mingw-w64-x86_64-libvorbis mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig mingw-w64-x86_64-libass mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libiconv mingw-w64-x86_64-gettext

      - name: Download Pre-built Whisper
        uses: actions/download-artifact@v4
        with:
          name: whisper-windows-latest
          path: ${{ github.workspace }}/whisper_download

      - name: Extract Whisper
        shell: msys2 {0}
        run: |
          WORKSPACE=$(cygpath "$GITHUB_WORKSPACE")
          tar xzf "$WORKSPACE/whisper_download/whisper_install-windows-x86_64.tar.gz" -C "$WORKSPACE/whisper_download"

      - name: Build ffnvcodec headers
        shell: msys2 {0}
        run: git clone https://github.com/FFmpeg/nv-codec-headers.git && cd nv-codec-headers && make install PREFIX=/mingw64

      - name: Copy Whisper libs to MSYS2
        shell: msys2 {0}
        run: |
          WORKSPACE=$(cygpath "$GITHUB_WORKSPACE")
          WHISPER_DIR="$WORKSPACE/whisper_download/whisper_target"
          cp -r "$WHISPER_DIR/lib"/* /mingw64/lib/
          cp -r "$WHISPER_DIR/include"/* /mingw64/include/
          for pc in "$WHISPER_DIR/lib/pkgconfig"/*.pc; do
            [ -f "$pc" ] && sed -i 's|^prefix=.*|prefix=/mingw64|' "/mingw64/lib/pkgconfig/$(basename "$pc")" || true
          done

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg && git checkout "${{ inputs.ffmpeg_ref }}"
          ./configure --prefix="$PWD/install" --target-os=mingw32 --arch=x86_64 --disable-debug --disable-doc --enable-gpl --enable-version3 --enable-static --disable-shared --enable-libx264 --enable-libx265 --enable-libvpx --enable-libopus --enable-libvorbis --enable-whisper --enable-nvenc --enable-nvdec --pkg-config-flags="--static" --extra-ldflags="-static -static-libgcc -Wl,--allow-multiple-definition" --extra-libs="-lpthread -lm -lbcrypt"
          make -j$(nproc) && make install
          mkdir -p package && cp -v install/bin/ffmpeg.exe install/bin/ffprobe.exe package/

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: FFmpeg/package/